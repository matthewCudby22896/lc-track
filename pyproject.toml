[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lc-track"
version = "0.1.3"
description = "LeetCode Tracker CLI Tool for tracking LC problem study"
readme = "README.md"
requires-python = ">=3.1"
license = {text = "MIT"}
dependencies = [
  "typer>=0.12.0",
  "platformdirs>=4.2.0",
  "PyGithub>=2.5.0",
  "GitPython>=3.1.43",
  "requests>=2.31.0",
  "rich>=13.0.0",
]

[project.scripts]
lc-track = "lctrack.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lctrack"]
